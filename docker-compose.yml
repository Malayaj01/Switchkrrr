services:
  postgres:
    image: postgres:16-alpine
    container_name: switchkrr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: switchkrr
      POSTGRES_USER: switchkrr
      POSTGRES_PASSWORD: switchkrr
    ports:
      - "5432:5432"
    volumes:
      - switchkrr-postgres:/var/lib/postgresql/data

volumes:
  switchkrr-postgres:
